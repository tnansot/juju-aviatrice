<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>juju-aviatrice — FO-04 Accueil (référence)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* ===== SHELL WIREFRAME (copie conforme — ne pas modifier) ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #d5d5d5; color: #333; }
    a { color: #4a90d9; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wf-bar { background: #f0f0f0; border-bottom: 1px solid #ccc; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.75rem; color: #999; font-family: system-ui, -apple-system, sans-serif; }
    .wf-bar .wf-label { text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .wf-bar .wf-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 3px; margin-left: 8px; text-transform: none; letter-spacing: 0; font-weight: 600; }
    .wf-bar .wf-badge-mobile { background: #dcedc8; color: #558b2f; }
    .wf-bar .wf-controls { display: flex; gap: 8px; align-items: center; }
    .wf-bar a { color: #999; font-size: 0.75rem; }
    .wf-bar a:hover { color: #666; }
    .wf-btn { padding: 3px 10px; border: 1px solid #ccc; border-radius: 3px; background: #fff; cursor: pointer; font-size: 0.7rem; color: #999; font-family: inherit; }
    .wf-btn.active { background: #555; color: #fff; border-color: #555; }
    .wf-container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 0 0 1px #bbb; position: relative; overflow: hidden; }
    .wf-container.desktop { max-width: 100%; box-shadow: none; overflow: visible; }
    @media (max-width: 768px) {
      .wf-container { max-width: 100% !important; box-shadow: none; }
      .wf-bar .wf-badge { display: none; }
    }
    /* ===== FIN SHELL ===== */

    /* ===== DESIGN TOKENS (copie inline de design-tokens.css) ===== */
    :root {
      --color-primary: #2563EB;
      --color-primary-light: #3B82F6;
      --color-primary-dark: #1D4ED8;
      --color-primary-soft: #DBEAFE;
      --color-secondary: #7C3AED;
      --color-secondary-light: #8B5CF6;
      --color-secondary-soft: #EDE9FE;
      --color-accent: #F97316;
      --color-accent-light: #FDBA74;
      --color-accent-dark: #EA580C;
      --color-accent-soft: #FFF7ED;
      --color-warm-50: #FFFBEB;
      --color-warm-100: #FEF3C7;
      --color-neutral-50: #FAFAF9;
      --color-neutral-100: #F5F5F4;
      --color-neutral-200: #E7E5E4;
      --color-neutral-300: #D6D3D1;
      --color-neutral-400: #A8A29E;
      --color-neutral-500: #78716C;
      --color-neutral-600: #57534E;
      --color-neutral-700: #44403C;
      --color-neutral-800: #292524;
      --color-neutral-900: #1C1917;
      --color-success: #22C55E;
      --color-error: #EF4444;
      --font-display: 'Outfit', system-ui, -apple-system, sans-serif;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-full: 100px;
      --shadow-sm: 0 2px 8px rgba(28, 25, 23, 0.04);
      --shadow-md: 0 4px 16px rgba(28, 25, 23, 0.06);
      --shadow-lg: 0 8px 32px rgba(28, 25, 23, 0.08);
      --shadow-glow-accent: 0 4px 24px rgba(249, 115, 22, 0.2);
    }

    /* ===== CSS SPÉCIFIQUE AU CORPS DE L'ÉCRAN ===== */
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px;
      min-height: calc(100vh - 40px);
      background: linear-gradient(180deg, var(--color-accent-soft) 0%, var(--color-warm-50) 40%, white 100%);
      font-family: var(--font-body);
    }

    /* --- Avatar zone --- */
    .avatar-zone {
      text-align: center;
      margin-bottom: 32px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-accent-light), var(--color-accent));
      border: 4px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      box-shadow: var(--shadow-glow-accent);
      font-size: 2.5rem;
      transition: transform 400ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .avatar:hover {
      transform: scale(1.06);
    }
    .avatar-name {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-neutral-900);
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }
    .avatar-stade {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-accent);
    }

    /* --- Suggestion card --- */
    .suggestion-card {
      width: 100%;
      max-width: 320px;
      background: white;
      border: 2px solid var(--color-warm-100);
      border-radius: var(--radius-xl);
      padding: 28px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
    }
    .suggestion-label {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--color-accent);
      margin-bottom: 10px;
    }
    .suggestion-text {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--color-neutral-900);
      margin-bottom: 20px;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .btn-go {
      display: block;
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--color-accent), #FB923C);
      color: white;
      border: none;
      border-radius: var(--radius-full);
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      letter-spacing: -0.01em;
      box-shadow: var(--shadow-glow-accent);
      transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-go:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(249, 115, 22, 0.3);
      text-decoration: none;
    }

    /* --- Changer link --- */
    .btn-change {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-neutral-400);
      text-decoration: none;
      transition: color 150ms ease-out;
    }
    .btn-change:hover {
      color: var(--color-neutral-600);
      text-decoration: none;
    }

    /* --- Stats --- */
    .stats {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-top: auto;
      padding-top: 32px;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--color-accent);
      letter-spacing: -0.03em;
    }
    .stat-label {
      font-family: var(--font-body);
      font-size: 0.75rem;
      color: var(--color-neutral-400);
    }
  </style>
</head>
<body data-wf-default="mobile">

  <!-- Barre wireframe (identique à wireframe.html) -->
  <div class="wf-bar">
    <span class="wf-label">Écran de référence — FO-04 Accueil rhabillé<span class="wf-badge wf-badge-mobile">mobile-first</span></span>
    <div class="wf-controls">
      <a href="direction-artistique.html">DA</a>
      <button class="wf-btn" onclick="wfSet('mobile')">Mobile</button>
      <button class="wf-btn" onclick="wfSet('desktop')">Desktop</button>
    </div>
  </div>

  <div class="wf-container">
    <div class="screen">

      <div class="avatar-zone">
        <div class="avatar">✈️</div>
        <div class="avatar-name">Juju</div>
        <div class="avatar-stade">Stade 2 — Exploratrice</div>
      </div>

      <div class="suggestion-card">
        <div class="suggestion-label">Suggestion</div>
        <div class="suggestion-text">Poursuis Géométrie : 4 flashcards</div>
        <a href="#" class="btn-go">Go</a>
      </div>

      <a href="#" class="btn-change">Changer d'activité</a>

      <div class="stats">
        <div class="stat">
          <div class="stat-value">12</div>
          <div class="stat-label">sessions</div>
        </div>
        <div class="stat">
          <div class="stat-value">47</div>
          <div class="stat-label">exercices</div>
        </div>
      </div>

    </div>
  </div>

  <!-- Script shell wireframe (copie conforme — ne pas modifier) -->
  <script>
  (function() {
    var def = document.body.getAttribute('data-wf-default') || 'mobile';
    var params = new URLSearchParams(window.location.search);
    var mql = window.matchMedia('(max-width: 768px)');
    window.wfSet = function(m) {
      var c = document.querySelector('.wf-container');
      var btns = document.querySelectorAll('.wf-btn');
      if (!c) return;
      btns.forEach(function(b) { b.classList.remove('active'); });
      if (m === 'desktop') { c.classList.add('desktop'); document.body.style.background = '#fff'; if (btns[1]) btns[1].classList.add('active'); }
      else { c.classList.remove('desktop'); document.body.style.background = '#d5d5d5'; if (btns[0]) btns[0].classList.add('active'); }
      var path = window.location.pathname.split('/').pop() || '';
      history.replaceState(null, '', path + '?wf=' + m);
      document.querySelectorAll('a[href]').forEach(function(a) {
        if (a.closest('.wf-controls')) return;
        var href = a.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('mailto:')) return;
        var base = href.split('?')[0];
        a.setAttribute('href', base + '?wf=' + m);
      });
    };
    var initial = params.get('wf') || (mql.matches ? 'mobile' : def);
    wfSet(initial);
    mql.addEventListener('change', function(e) { wfSet(e.matches ? 'mobile' : def); });
  })();
  </script>
</body>
</html>
